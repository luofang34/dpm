name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        # The MSRV is checked once, on Linux; macOS runs the stable toolchain, which also packages
        # and smoke-tests the native release archive.
        include:
          - { os: ubuntu-24.04, toolchain: msrv }
          - { os: ubuntu-24.04, toolchain: stable }
          - { os: macos-latest, toolchain: stable }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install selected Rust toolchain
        shell: bash
        env:
          TOOLCHAIN_KIND: ${{ matrix.toolchain }}
        run: |
          toolchain=stable
          if [ "$TOOLCHAIN_KIND" = msrv ]; then
            toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          fi
          # The cross-target checks in ci.sh need the targets rust-toolchain.toml lists.
          targets=$(python3 -c 'import tomllib; print(" ".join("--target " + t for t in tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"].get("targets", [])))')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy $targets
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      # The released binary, checksum-verified, instead of compiling the checker in every job.
      - name: Install dependency checker
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
      - name: Full local quality gates
        run: ./ci.sh
      - name: Package native binaries and corresponding source
        if: matrix.toolchain == 'stable'
        run: python3 scripts/package_release.py --output "$RUNNER_TEMP/dpm-release"
      - name: Test extracted binaries outside the checkout
        if: matrix.toolchain == 'stable'
        run: python3 scripts/smoke_release.py "$RUNNER_TEMP"/dpm-release/*.tar.gz
      - name: Retain qualified archives and checksums
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: dpm-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/dpm-release/*
          if-no-files-found: error
          compression-level: 0
