[package]
name = "dpm-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Adapter that connects the installed Claude Code runtime to DPM run records"

[[bin]]
name = "dpm-claude"
path = "src/main.rs"
doc = false

[dependencies]
dpm-app = { path = "../dpm-app", version = "0.1.0" }
dpm-model = { path = "../dpm-model", version = "0.1.0" }
chrono.workspace = true
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "process"] }
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
dpm-engine = { path = "../dpm-engine", version = "0.1.0" }
dpm-native = { path = "../dpm-native", version = "0.1.0" }
tempfile = "3"

[lints]
workspace = true
