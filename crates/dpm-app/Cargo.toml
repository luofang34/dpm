[package]
name = "dpm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared command/query service for DPM CLI and agent tools"

[dependencies]
dpm-model = { path = "../dpm-model", version = "0.1.0" }
dpm-engine = { path = "../dpm-engine", version = "0.1.0" }
dpm-store = { path = "../dpm-store", version = "0.1.0", default-features = false }
dpm-interchange = { path = "../dpm-interchange", version = "0.1.0" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = ["sqlite", "registry", "git"]
# Authoritative local SQLite stores: open, initialize, back up, restore and verify.
sqlite = ["dpm-store/sqlite"]
# The device-local registry resolving workspace identities to store paths.
registry = ["sqlite", "dep:rusqlite"]
# Git HEAD evidence captured by running the git command-line tool.
git = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
