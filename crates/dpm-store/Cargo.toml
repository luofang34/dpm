[package]
name = "dpm-store"
description = "SQLite persistence and append-only operation log for DPM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dpm-engine = { path = "../dpm-engine", version = "0.1.0" }
dpm-model = { path = "../dpm-model", version = "0.1.0" }
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
default = ["sqlite"]
# The SQLite store; without it only the records and errors it returns are built.
sqlite = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3.23"
chrono.workspace = true

[lints]
workspace = true
